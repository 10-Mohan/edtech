<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E231B" />
      <stop offset="50%" stop-color="#23281F" />
      <stop offset="100%" stop-color="#171A14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4562F" />
      <stop offset="50%" stop-color="#B08A2E" />
      <stop offset="100%" stop-color="#2F6F63" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB148" />
      <stop offset="100%" stop-color="#9C7722" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E26D45" />
      <stop offset="100%" stop-color="#A5401D" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA696" />
      <stop offset="100%" stop-color="#22534A" />
    </linearGradient>
    
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(216, 207, 184, 0.05)" stroke-width="1" />
      <circle cx="15" cy="15" r="0.75" fill="rgba(216, 207, 184, 0.12)" />
    </pattern>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#C4562F" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="300" r="180" fill="#2F6F63" opacity="0.18" filter="url(#glow)" />
  <circle cx="600" cy="190" r="120" fill="#B08A2E" opacity="0.12" filter="url(#glow)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="rgba(216, 207, 184, 0.12)" stroke-width="1.5" />

  <!-- Notebook Binder Stitch Left -->
  <g opacity="0.25">
    <line x1="48" y1="20" x2="48" y2="360" stroke="#D8CFB8" stroke-dasharray="8 6" stroke-width="2" />
  </g>

  <!-- Center Content Badge -->
  <g transform="translate(600, 75)">
    <rect x="-160" y="-18" width="320" height="36" rx="18" fill="rgba(243, 238, 226, 0.08)" stroke="rgba(216, 207, 184, 0.2)" stroke-width="1" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#E8DEC8">
      🎓 UNIVERSITY MANAGEMENT &amp; ACADEMIC PORTAL
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" text-anchor="middle" font-family="'Source Serif 4', Georgia, serif" font-size="52" font-weight="700" letter-spacing="-1" fill="#F3EEE2">
      Waypoint Academic Suite
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(600, 205)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#ABA79B">
      Next-Gen Student Learning Hub • Faculty Orchestration • Cognitive AI Knowledge Graphs
    </text>
  </g>

  <!-- Feature Highlights / Roles Pills -->
  <g transform="translate(600, 275)">
    <!-- Student Pill -->
    <g transform="translate(-310, 0)">
      <rect x="-105" y="-20" width="210" height="40" rx="20" fill="rgba(196, 86, 47, 0.15)" stroke="rgba(196, 86, 47, 0.4)" stroke-width="1.2" />
      <circle cx="-75" cy="0" r="6" fill="#C4562F" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F3EEE2">
        👨‍🎓 Student Notebook
      </text>
    </g>

    <!-- Faculty Pill -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-20" width="210" height="40" rx="20" fill="rgba(47, 111, 99, 0.15)" stroke="rgba(47, 111, 99, 0.4)" stroke-width="1.2" />
      <circle cx="-75" cy="0" r="6" fill="#2F6F63" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F3EEE2">
        👩‍🏫 Faculty Roll Book
      </text>
    </g>

    <!-- Admin / Parent Pill -->
    <g transform="translate(310, 0)">
      <rect x="-105" y="-20" width="210" height="40" rx="20" fill="rgba(176, 138, 46, 0.15)" stroke="rgba(176, 138, 46, 0.4)" stroke-width="1.2" />
      <circle cx="-75" cy="0" r="6" fill="#B08A2E" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F3EEE2">
        🏛️ Admin &amp; Governance
      </text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(600, 340)">
    <text x="0" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1" fill="#75736B">
      POWERED BY REACT 19 • SOCRATIC &amp; FEYNMAN AI • SUPABASE CLUSTER • SM-2 SPACED REPETITION
    </text>
  </g>
</svg>

<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" rx="12" fill="#ECE5D4" />
  
  <!-- Outer Window Chrome -->
  <rect x="20" y="20" width="760" height="480" rx="8" fill="#F3EEE2" stroke="#D8CFB8" stroke-width="2" />
  
  <!-- Window Top Bar -->
  <rect x="20" y="20" width="760" height="36" rx="8" fill="#E5DEC9" />
  <circle cx="42" cy="38" r="5" fill="#C4562F" />
  <circle cx="58" cy="38" r="5" fill="#B08A2E" />
  <circle cx="74" cy="38" r="5" fill="#2F6F63" />
  <text x="400" y="42" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#5B5F52" text-anchor="middle">Waypoint — Open Notebook Login</text>

  <!-- Left Page -->
  <g transform="translate(45, 75)">
    <rect width="335" height="405" rx="4" fill="#FBF8F1" stroke="#E3DAC5" />
    <rect x="20" y="-8" width="60" height="18" fill="rgba(216, 207, 184, 0.6)" transform="rotate(-3)" />
    
    <!-- Brand -->
    <circle cx="35" cy="40" r="8" fill="#C4562F" />
    <text x="50" y="44" font-family="'Source Serif 4', serif" font-size="18" font-weight="700" fill="#23281F">Waypoint <tspan font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#C4562F">AI</tspan></text>
    
    <text x="35" y="80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#75736B">TEACH IT BACK TO ME</text>
    
    <!-- Handwriting Box -->
    <rect x="35" y="100" width="265" height="150" rx="6" fill="#F3EDE0" stroke="#D8CFB8" stroke-dasharray="3 3" />
    <text x="48" y="135" font-family="'Caveat', cursive, serif" font-size="19" font-weight="600" fill="#23281F">"So optimization is really just..."</text>
    <text x="48" y="170" font-family="'Caveat', cursive, serif" font-size="19" font-weight="600" fill="#23281F">"...finding where the derivative"</text>
    <text x="48" y="205" font-family="'Caveat', cursive, serif" font-size="19" font-weight="600" fill="#23281F">"goes flat. The peak of the hill."</text>
    
    <!-- Margin Note -->
    <rect x="35" y="275" width="265" height="85" rx="6" fill="rgba(47, 111, 99, 0.08)" stroke="rgba(47, 111, 99, 0.2)" />
    <text x="48" y="300" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2F6F63">Feynman Check:</text>
    <text x="48" y="320" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">Explaining concepts in plain English reveals</text>
    <text x="48" y="338" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">exact knowledge gaps in real-time.</text>
  </g>

  <!-- Notebook Spine Divider -->
  <line x1="400" y1="75" x2="400" y2="480" stroke="#C8BFA7" stroke-width="2" stroke-dasharray="6 4" />

  <!-- Right Page -->
  <g transform="translate(420, 75)">
    <rect width="335" height="405" rx="4" fill="#FBF8F1" stroke="#E3DAC5" />

    <!-- Role Toggle -->
    <g transform="translate(25, 25)">
      <rect width="285" height="34" rx="17" fill="#ECE5D4" />
      <rect x="3" y="3" width="138" height="28" rx="14" fill="#F3EEE2" stroke="#D8CFB8" />
      <text x="72" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C4562F" text-anchor="middle">Student</text>
      <text x="212" y="21" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#75736B" text-anchor="middle">Faculty</text>
    </g>

    <text x="25" y="88" font-family="'Source Serif 4', serif" font-size="18" font-weight="700" fill="#23281F">Pick up your notebook</text>
    <text x="25" y="106" font-family="'Inter', sans-serif" font-size="11" fill="#75736B">Where you left off, exactly.</text>

    <!-- Email Field -->
    <g transform="translate(25, 125)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#5B5F52">EMAIL</text>
      <rect x="0" y="6" width="285" height="36" rx="6" fill="#F3EEE2" stroke="#D8CFB8" />
      <text x="12" y="29" font-family="'Inter', sans-serif" font-size="12" fill="#23281F">maya.lin@student.waypoint.edu</text>
    </g>

    <!-- Password Field -->
    <g transform="translate(25, 185)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#5B5F52">PASSWORD</text>
      <rect x="0" y="6" width="285" height="36" rx="6" fill="#F3EEE2" stroke="#D8CFB8" />
      <text x="12" y="30" font-family="'Inter', sans-serif" font-size="13" fill="#23281F">••••••••</text>
    </g>

    <!-- Submit Button -->
    <rect x="25" y="245" width="285" height="40" rx="6" fill="#C4562F" />
    <text x="167" y="270" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Open notebook →</text>

    <!-- Quick Credentials -->
    <text x="25" y="312" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#75736B">DEMO CREDENTIALS</text>
    <g transform="translate(25, 322)">
      <rect width="90" height="24" rx="4" fill="#ECE5D4" stroke="#D8CFB8" />
      <text x="45" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#23281F" text-anchor="middle">Maya (Student)</text>
    </g>
    <g transform="translate(122, 322)">
      <rect width="95" height="24" rx="4" fill="#ECE5D4" stroke="#D8CFB8" />
      <text x="47" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#23281F" text-anchor="middle">Dr. Vance (Faculty)</text>
    </g>
    <g transform="translate(224, 322)">
      <rect width="86" height="24" rx="4" fill="#ECE5D4" stroke="#D8CFB8" />
      <text x="43" y="16" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#23281F" text-anchor="middle">Elena (Parent)</text>
    </g>

    <!-- Register Link -->
    <text x="167" y="375" font-family="'Inter', sans-serif" font-size="11" fill="#75736B" text-anchor="middle">
      New here? <tspan font-weight="700" fill="#C4562F">Register new account</tspan>
    </text>
  </g>
</svg>

<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" rx="12" fill="#ECE5D4" />
  
  <!-- Main Book Container -->
  <g transform="translate(40, 40)">
    <!-- Book Shadow & Base -->
    <rect width="720" height="440" rx="6" fill="#F3EEE2" stroke="#D8CFB8" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(35,40,31,0.15))" />
    
    <!-- Left Page -->
    <g transform="translate(0, 0)">
      <rect width="360" height="440" rx="6" fill="#F3EEE2" />
      <line x1="360" y1="0" x2="360" y2="440" stroke="#D8CFB8" stroke-width="1.5" />
      
      <!-- Tape piece -->
      <rect x="250" y="24" width="60" height="20" rx="2" fill="rgba(196, 86, 47, 0.25)" transform="rotate(-4 250 24)" />
      
      <!-- Brand -->
      <circle cx="36" cy="40" r="4" fill="#C4562F" />
      <text x="48" y="44" font-family="'Source Serif 4', serif" font-size="16" font-weight="600" fill="#23281F">Waypoint <tspan font-style="italic" font-weight="400" fill="#5B5F52">AI</tspan></text>
      
      <!-- Prompt label -->
      <text x="36" y="88" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#C4562F" letter-spacing="1.2">TEACH IT BACK TO ME</text>
      
      <!-- Handwriting -->
      <text x="36" y="130" font-family="'Caveat', cursive, serif" font-size="22" fill="#23281F">So optimization is really just...</text>
      <text x="36" y="165" font-family="'Caveat', cursive, serif" font-size="22" fill="#23281F">...finding where the derivative</text>
      <text x="36" y="200" font-family="'Caveat', cursive, serif" font-size="22" fill="#23281F">goes flat. The peak of the hill.</text>
      
      <!-- Margin Note -->
      <line x1="36" y1="360" x2="324" y2="360" stroke="#D8CFB8" stroke-dasharray="3 3" />
      <text x="36" y="385" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">The <tspan font-weight="700" fill="#23281F">Feynman check</tspan>: if you can't explain optimization</text>
      <text x="36" y="402" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">without jargon, the graph reveals the foundational gap.</text>
    </g>

    <!-- Right Page (Auth Form) -->
    <g transform="translate(360, 0)">
      <!-- Lined paper background pattern -->
      <line x1="0" y1="38" x2="360" y2="38" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="76" x2="360" y2="76" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="114" x2="360" y2="114" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="152" x2="360" y2="152" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="190" x2="360" y2="190" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="228" x2="360" y2="228" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="266" x2="360" y2="266" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="304" x2="360" y2="304" stroke="#E5DEC9" stroke-width="1" />
      <line x1="0" y1="342" x2="360" y2="342" stroke="#E5DEC9" stroke-width="1" />

      <!-- 3-Role Tabs -->
      <g transform="translate(36, 32)">
        <text x="30" y="16" font-family="'Source Serif 4', serif" font-size="13" font-weight="700" fill="#23281F" text-anchor="middle">Student</text>
        <text x="144" y="16" font-family="'Source Serif 4', serif" font-size="13" font-weight="500" fill="#5B5F52" text-anchor="middle">Faculty</text>
        <text x="258" y="16" font-family="'Source Serif 4', serif" font-size="13" font-weight="500" fill="#5B5F52" text-anchor="middle">Parent</text>
        <line x1="0" y1="28" x2="288" y2="28" stroke="#23281F" stroke-width="2" />
        <rect x="0" y="26" width="96" height="3" fill="#C4562F" />
      </g>

      <!-- Title & Hint -->
      <text x="36" y="92" font-family="'Source Serif 4', serif" font-size="18" font-weight="700" fill="#23281F">Pick up your notebook</text>
      <text x="36" y="110" font-family="'Inter', sans-serif" font-size="11" font-style="italic" fill="#5B5F52">Where you left off, exactly.</text>

      <!-- Email Field -->
      <text x="36" y="142" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#5B5F52" letter-spacing="1">EMAIL</text>
      <text x="36" y="164" font-family="'Courier New', monospace" font-size="12" fill="#23281F">maya.lin@student.waypoint.edu</text>
      <line x1="36" y1="172" x2="324" y2="172" stroke="#23281F" stroke-width="1" />

      <!-- Password Field -->
      <text x="36" y="202" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#5B5F52" letter-spacing="1">PASSWORD</text>
      <text x="36" y="224" font-family="'Inter', sans-serif" font-size="14" fill="#23281F">••••••••••</text>
      <line x1="36" y1="232" x2="324" y2="232" stroke="#23281F" stroke-width="1" />

      <!-- Submit Button -->
      <rect x="36" y="256" width="288" height="38" rx="4" fill="#23281F" />
      <text x="180" y="280" font-family="'Source Serif 4', serif" font-size="13" font-weight="600" fill="#F3EEE2" text-anchor="middle">Open notebook →</text>

      <!-- Demo Credentials Pills -->
      <line x1="36" y1="316" x2="324" y2="316" stroke="#D8CFB8" stroke-dasharray="3 3" />
      <text x="36" y="334" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#75736B">DEMO CREDENTIALS:</text>
      
      <g transform="translate(36, 344)">
        <rect x="0" y="0" width="86" height="22" rx="4" fill="#EAE2CE" stroke="#D8CFB8" />
        <text x="43" y="14" font-family="'Inter', sans-serif" font-size="9.5" fill="#23281F" text-anchor="middle">Maya (Student)</text>

        <rect x="94" y="0" width="94" height="22" rx="4" fill="#EAE2CE" stroke="#D8CFB8" />
        <text x="141" y="14" font-family="'Inter', sans-serif" font-size="9.5" fill="#23281F" text-anchor="middle">Dr. Eleanor (Faculty)</text>

        <rect x="196" y="0" width="92" height="22" rx="4" fill="#EAE2CE" stroke="#D8CFB8" />
        <text x="242" y="14" font-family="'Inter', sans-serif" font-size="9.5" fill="#23281F" text-anchor="middle">Elena (Parent)</text>
      </g>

      <text x="180" y="395" font-family="'Inter', sans-serif" font-size="11" fill="#75736B" text-anchor="middle">New here? <tspan font-weight="700" text-decoration="underline" fill="#23281F">Register new account</tspan></text>

      <!-- Stamp -->
      <circle cx="288" cy="405" r="24" stroke="#D8CFB8" stroke-width="1" stroke-dasharray="2 2" />
      <text x="288" y="402" font-family="'Source Serif 4', serif" font-size="7" fill="#B8AF98" text-anchor="middle">WAYPOINT</text>
      <text x="288" y="412" font-family="'Source Serif 4', serif" font-size="6" fill="#B8AF98" text-anchor="middle">EST. SESSION</text>
    </g>
  </g>
</svg>

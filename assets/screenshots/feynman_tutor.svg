<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" rx="12" fill="#ECE5D4" />
  
  <!-- Window Container -->
  <rect x="20" y="20" width="760" height="480" rx="8" fill="#F3EEE2" stroke="#D8CFB8" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="48" rx="8" fill="#EAE2CE" />
  <text x="40" y="49" font-family="'Source Serif 4', serif" font-size="16" font-weight="700" fill="#23281F">Feynman Technique: "Teach It Back to Me"</text>
  <rect x="635" y="32" width="125" height="24" rx="12" fill="rgba(196, 86, 47, 0.15)" />
  <text x="697" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C4562F" text-anchor="middle">🎯 Topic: Optimization</text>

  <!-- Main Grid -->
  <g transform="translate(40, 85)">
    <!-- Left: Student Explanation Area -->
    <rect width="360" height="390" rx="8" fill="#FDFBF7" stroke="#D8CFB8" />
    <text x="20" y="28" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#75736B">STUDENT EXPLANATION</text>

    <rect x="20" y="42" width="320" height="180" rx="6" fill="#FBF8F1" stroke="#E3DAC5" />
    <text x="32" y="70" font-family="'Caveat', cursive, serif" font-size="18" fill="#23281F">"To find the maximum or minimum of a"</text>
    <text x="32" y="98" font-family="'Caveat', cursive, serif" font-size="18" fill="#23281F">"function, we take the derivative f'(x)"</text>
    <text x="32" y="126" font-family="'Caveat', cursive, serif" font-size="18" fill="#23281F">"and set it equal to 0 to find critical points."</text>
    <text x="32" y="154" font-family="'Caveat', cursive, serif" font-size="18" fill="#23281F">"Then we use the second derivative test."</text>

    <!-- Evaluation Audio/Vision Bar -->
    <g transform="translate(20, 235)">
      <rect width="320" height="42" rx="6" fill="#ECE5D4" stroke="#D8CFB8" />
      <circle cx="22" cy="21" r="10" fill="#2F6F63" />
      <text x="22" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
      <text x="42" y="26" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#23281F">Speech transcript parsed &amp; evaluated</text>
    </g>

    <rect x="20" y="295" width="320" height="42" rx="6" fill="#C4562F" />
    <text x="180" y="321" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Evaluate Explanation (Gemini 2.5) →</text>
  </g>

  <!-- Right: Cognitive Breakdown & Score -->
  <g transform="translate(420, 85)">
    <rect width="340" height="390" rx="8" fill="#FDFBF7" stroke="#D8CFB8" />
    
    <!-- Score Header -->
    <g transform="translate(20, 20)">
      <text x="0" y="18" font-family="'Source Serif 4', serif" font-size="18" font-weight="700" fill="#23281F">Cognitive AI Evaluation</text>
      <rect x="230" y="0" width="70" height="28" rx="14" fill="rgba(47, 111, 99, 0.15)" />
      <text x="265" y="18" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#2F6F63" text-anchor="middle">84/100</text>
    </g>

    <!-- Feedback Sections -->
    <g transform="translate(20, 60)">
      <rect width="300" height="75" rx="6" fill="#E8F4F1" stroke="#C5E3DC" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2F6F63">✅ Strong First-Principles Understanding</text>
      <text x="12" y="42" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">Accurately connected tangent line slope (f'=0)</text>
      <text x="12" y="58" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">to horizontal extrema.</text>
    </g>

    <g transform="translate(20, 145)">
      <rect width="300" height="85" rx="6" fill="#FEF3EE" stroke="#F6D5C7" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C4562F">⚠️ Missing Critical Boundary Nuance</text>
      <text x="12" y="42" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">You forgot to mention evaluating endpoints [a, b]</text>
      <text x="12" y="58" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">for absolute extrema on closed intervals!</text>
    </g>

    <!-- Socratic Bridge Prompt -->
    <g transform="translate(20, 240)">
      <rect width="300" height="100" rx="6" fill="#F3EDE0" stroke="#D8CFB8" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#B08A2E">💡 Next Socratic Question:</text>
      <text x="12" y="44" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">"What happens if f(x) is strictly increasing</text>
      <text x="12" y="60" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">on [0, 5]? Where is the global maximum</text>
      <text x="12" y="76" font-family="'Inter', sans-serif" font-size="10.5" fill="#23281F">if f'(x) is never equal to 0?"</text>
    </g>
  </g>
</svg>

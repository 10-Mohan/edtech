<svg width="800" height="520" viewBox="0 0 800 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="520" rx="12" fill="#ECE5D4" />
  
  <!-- Window Container -->
  <rect x="20" y="20" width="760" height="480" rx="8" fill="#F3EEE2" stroke="#D8CFB8" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="48" rx="8" fill="#E8DEC8" />
  <circle cx="48" cy="44" r="14" fill="#B08A2E" />
  <text x="70" y="48" font-family="'Source Serif 4', serif" font-size="16" font-weight="700" fill="#23281F">Elena Lin</text>
  <text x="145" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#75736B">Parent &amp; Family Bridge · Maya Lin</text>

  <!-- Metric Badges -->
  <g transform="translate(450, 32)">
    <rect width="140" height="24" rx="12" fill="rgba(47, 111, 99, 0.15)" />
    <text x="70" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#2F6F63" text-anchor="middle">Attendance: 96.8%</text>
  </g>
  <g transform="translate(605, 32)">
    <rect width="150" height="24" rx="12" fill="rgba(176, 138, 46, 0.15)" />
    <text x="75" y="16" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#B08A2E" text-anchor="middle">Academic Index: 91/100</text>
  </g>

  <!-- Main Content Grid -->
  <g transform="translate(35, 80)">
    <text x="0" y="18" font-family="'Source Serif 4', serif" font-size="20" font-weight="700" fill="#23281F">Maya's Weekly Learning Digest</text>

    <!-- Card 1: Plain Language Summary -->
    <g transform="translate(0, 35)">
      <rect width="450" height="175" rx="8" fill="#FDFBF7" stroke="#D8CFB8" />
      <text x="20" y="28" font-family="'Source Serif 4', serif" font-size="14" font-weight="700" fill="#23281F">What Maya Mastered This Week</text>
      
      <rect x="20" y="42" width="410" height="115" rx="6" fill="#FAF6EE" />
      <text x="32" y="66" font-family="'Inter', sans-serif" font-size="11.5" fill="#23281F">"Maya made exceptional progress in Limits &amp; Derivatives,</text>
      <text x="32" y="86" font-family="'Inter', sans-serif" font-size="11.5" fill="#23281F">scoring in the top 10% on conceptual intuition. She</text>
      <text x="32" y="106" font-family="'Inter', sans-serif" font-size="11.5" fill="#23281F">is currently reinforcing Optimization boundary conditions."</text>
      
      <rect x="32" y="122" width="130" height="22" rx="4" fill="#E8F4F1" />
      <text x="97" y="137" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#2F6F63" text-anchor="middle">3h 45m Active Practice</text>
    </g>

    <!-- Card 2: Dinner Table Conversation Starter -->
    <g transform="translate(0, 225)">
      <rect width="450" height="170" rx="8" fill="#FDFBF7" stroke="#D8CFB8" />
      <text x="20" y="28" font-family="'Source Serif 4', serif" font-size="14" font-weight="700" fill="#B08A2E">🍽️ Dinner Table Conversation Starter</text>
      
      <rect x="20" y="42" width="410" height="110" rx="6" fill="#FDF8EE" stroke="#EFE5CD" />
      <text x="32" y="68" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#23281F">Ask Maya tonight:</text>
      <text x="32" y="88" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">"How do 3D video game engines calculate race car</text>
      <text x="32" y="106" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">drifting acceleration using calculus derivatives?"</text>
      <text x="32" y="132" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#B08A2E">Promotes authentic, jargon-free Feynman explanation.</text>
    </g>

    <!-- Right Side: Academic Breakdown & Attendance Matrix -->
    <g transform="translate(465, 35)">
      <rect width="265" height="360" rx="8" fill="#FDFBF7" stroke="#D8CFB8" />
      <text x="18" y="28" font-family="'Source Serif 4', serif" font-size="14" font-weight="700" fill="#23281F">Academic Summary</text>

      <g transform="translate(18, 45)">
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">Calculus Grade:</text>
        <text x="225" y="15" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2F6F63" text-anchor="end">94% (A)</text>
      </g>

      <g transform="translate(18, 75)">
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">Attendance Rate:</text>
        <text x="225" y="15" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#2F6F63" text-anchor="end">96.8% (31/32)</text>
      </g>

      <g transform="translate(18, 105)">
        <text x="0" y="15" font-family="'Inter', sans-serif" font-size="11" fill="#5B5F52">SM-2 Cards Due:</text>
        <text x="225" y="15" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#C4562F" text-anchor="end">5 Cards</text>
      </g>

      <line x1="18" y1="140" x2="245" y2="140" stroke="#EAE2CE" />

      <text x="18" y="165" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#75736B">PERIOD LOG</text>
      <rect x="18" y="175" width="227" height="110" rx="6" fill="#FBF8F1" stroke="#E5DEC9" />
      <text x="28" y="198" font-family="'Inter', sans-serif" font-size="10" fill="#23281F">Aug 07 — Calculus: <tspan font-weight="700" fill="#2F6F63">Present</tspan></text>
      <text x="28" y="222" font-family="'Inter', sans-serif" font-size="10" fill="#23281F">Aug 06 — Calculus: <tspan font-weight="700" fill="#2F6F63">Present</tspan></text>
      <text x="28" y="246" font-family="'Inter', sans-serif" font-size="10" fill="#23281F">Aug 05 — Calculus: <tspan font-weight="700" fill="#2F6F63">Present</tspan></text>
      <text x="28" y="270" font-family="'Inter', sans-serif" font-size="10" fill="#23281F">Aug 04 — Calculus: <tspan font-weight="700" fill="#C4562F">Excused</tspan></text>

      <rect x="18" y="305" width="227" height="38" rx="6" fill="#B08A2E" />
      <text x="131" y="329" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Print Comprehensive Report</text>
    </g>
  </g>
</svg>
